<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third-Party Site - Testimonial Embed Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 40px 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    .header p {
      margin: 0;
      color: #94a3b8;
      font-size: 16px;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .section {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }
    .section h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1e293b;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      background-color: #e0e7ff;
      color: #4338ca;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Acme Corp - Customer Portal</h1>
    <p>This page simulates an external 3rd-party website embedding the Testimonial Platform widget.</p>
  </div>

  <div class="container">
    
    <!-- Section 1: iFrame Embed with Custom Indigo Accent (#4f46e5) and Grid Layout -->
    <div class="section">
      <h2>What Our Customers Say <span class="badge">iFrame Embed (Grid Layout)</span></h2>
      
      <iframe 
        src="https://testimonial-platform-beta.vercel.app/embed?accent=%234f46e5&layout=grid&limit=6" 
        width="100%" 
        height="500" 
        style="border: none; border-radius: 12px; overflow: hidden;"
        title="Testimonial iFrame Widget">
      </iframe>
    </div>

    <!-- Section 2: iFrame Embed with Emerald Accent (#059669) and List Layout -->
    <div class="section">
      <h2>Recent Feedback <span class="badge">iFrame Embed (List Layout)</span></h2>
      
      <iframe 
        src="https://testimonial-platform-beta.vercel.app/embed?accent=%23059669&layout=list&limit=3" 
        width="100%" 
        height="450" 
        style="border: none; border-radius: 12px; overflow: hidden;"
        title="Testimonial iFrame Widget List">
      </iframe>
    </div>

  </div>

</body>
</html>
